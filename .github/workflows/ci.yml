name: CI - Test & Lint

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8

    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Test with pytest
      run: |
        pytest tests/ -v || echo "No tests found, skipping"

    - name: Test bot imports
      run: |
        python -c "from src.bot import MarketMonitorBot; print('Bot import OK')"
        python -c "from src.api.main import app; print('API import OK')"
        python -c "from src.core.indicators import TechnicalIndicators; print('Indicators OK')"

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t ifsa-market-monitor:test .

    - name: Test Docker image
      run: |
        docker run --rm ifsa-market-monitor:test python -c "from src.bot import MarketMonitorBot; print('Docker OK')"
